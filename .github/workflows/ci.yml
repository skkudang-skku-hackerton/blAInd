name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check-and-package:
    name: Check and package extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Chrome, Firefox, Safari, and Firefox review sources
        run: npm run zip
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
